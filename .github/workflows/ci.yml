name: Validate VPN setup scripts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax and mocked routing
        run: bash tests/smoke.sh
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh
